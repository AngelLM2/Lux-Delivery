name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests com Postgres e Redis reais)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lux
          POSTGRES_PASSWORD: lux
          POSTGRES_DB: lux_delivery
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lux" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests alembic
          ruff format --check app tests
      - name: Tests (inclui alembic check contra drift de schema)
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  contract:
    name: Contrato OpenAPI (API <-> tipos do front)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r apps/api/requirements.txt
      - name: Exporta o contrato da API
        working-directory: apps/api
        run: python -m app.scripts.export_openapi ../web/openapi.json
      - name: Regenera os tipos do front
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run gen:api
      - name: Falha se algo mudou (alguem alterou a API sem atualizar o front)
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/shared/api/schema.d.ts

  docs:
    name: Docs (links e âncoras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_doc_links.py

  k8s:
    name: Manifests Kubernetes (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderiza e valida contra o schema oficial
        run: |
          docker run --rm -v "$PWD/infra/k8s:/k" registry.k8s.io/kubectl:v1.33.0 kustomize /k > rendered.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:latest -strict -summary /w/rendered.yaml

  web:
    name: Web (lint + typecheck + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Docker images + compose
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Valida os arquivos compose
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.scale.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
      - name: Build
        run: docker compose build migrate web
      - name: Smoke test da stack completa
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health/ready && break; sleep 3; done
          docker compose ps -a
          test "$(docker compose ps -a seed --format '{{.ExitCode}}')" = "0"
          curl -fsS http://localhost:8080/api/v1/products | python3 -c "import sys,json; assert len(json.load(sys.stdin)['items']) > 0"
      - if: failure()
        run: docker compose logs --tail 200
