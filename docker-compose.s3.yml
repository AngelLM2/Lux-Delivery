# Imagens em object storage S3-compativel, localmente via SeaweedFS (docs/07-escalabilidade, estagio 2).
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d
# Em producao troque so as variaveis S3_* e libere o dominio das imagens no img-src da CSP do nginx.

x-s3-env: &s3-env
  STORAGE_BACKEND: s3
  S3_BUCKET: lux-media
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: local-dev
  S3_SECRET_ACCESS_KEY: local-dev-secret
  S3_PUBLIC_BASE_URL: http://localhost:8333/lux-media

services:
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333", "-dir=/data", "-master.volumeSizeLimitMB=256"]
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: lux-delivery/api:dev
    environment: *s3-env
    entrypoint:
      - python
      - -c
      - |
        import boto3, os, time
        s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT_URL"], region_name="us-east-1",
                          aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"], aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"])
        for attempt in range(30):
            try:
                existing = [b["Name"] for b in s3.list_buckets().get("Buckets", [])]
                if "lux-media" not in existing:
                    s3.create_bucket(Bucket="lux-media")
                print("bucket lux-media pronto")
                break
            except Exception as exc:
                print("aguardando s3:", exc); time.sleep(2)
        else:
            raise SystemExit(1)
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  api:
    environment: *s3-env
    depends_on:
      s3-init:
        condition: service_completed_successfully

volumes:
  s3_data:
