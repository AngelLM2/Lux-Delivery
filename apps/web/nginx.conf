# Serves the SPA and reverse-proxies the API on the same origin:
#  - no CORS preflights, SameSite=Strict cookies just work
#  - one place for TLS, compression, caching headers and load balancing

upstream lux_api {
    # Docker DNS returns every replica of the "api" service; nginx round-robins across them.
    server api:8000;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://images.unsplash.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Server-Sent Events: no buffering, long read timeout.
    location = /api/v1/events/stream {
        proxy_pass http://lux_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://lux_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        client_max_body_size 6m;
    }

    location /media/ {
        proxy_pass http://lux_api;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /metrics is deliberately NOT exposed publicly; Prometheus scrapes the API directly.
    location /health/ {
        proxy_pass http://lux_api;
    }

    # Hashed assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
