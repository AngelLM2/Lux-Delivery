apiVersion: v1
kind: ConfigMap
metadata:
  name: lux-config
data:
  ENV: production
  LOG_JSON: "true"
  CORS_ORIGINS: https://lux.example.com
  TRUSTED_PROXIES: 10.0.0.0/8
  STORAGE_BACKEND: s3
  S3_BUCKET: lux-media
  S3_PUBLIC_BASE_URL: https://cdn.lux.example.com
  DB_BEHIND_PGBOUNCER: "true"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
---
# Exemplo apenas. Em producao use External Secrets / Sealed Secrets / Vault.
# Nunca commite segredos reais.
apiVersion: v1
kind: Secret
metadata:
  name: lux-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://lux:CHANGE_ME@pgbouncer.lux.svc:5432/lux_delivery
  DIRECT_DATABASE_URL: postgresql+asyncpg://lux:CHANGE_ME@lux-db.internal:5432/lux_delivery
  REDIS_URL: rediss://:CHANGE_ME@lux-redis.internal:6379/0
  SECRET_KEY: CHANGE_ME_TO_A_LONG_RANDOM_VALUE_AT_LEAST_32_CHARS
  METRICS_TOKEN: CHANGE_ME
