apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lux
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    # SSE: sem buffering e conexoes longas.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lux.example.com]
      secretName: lux-tls
  rules:
    - host: lux.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: lux-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: lux-web, port: {name: http}}}
