# Producao em um unico servidor (docs/07-escalabilidade/01-estagio-0-1-a-10-usuarios.md).
#   cp infra/single-node/.env.prod.example .env.prod   # preencha os segredos
#   docker compose --env-file .env.prod -f docker-compose.yml -f infra/single-node/docker-compose.prod.yml up -d --build

x-prod-env: &prod-env
  ENV: production
  LOG_JSON: "true"
  DATABASE_URL: postgresql+asyncpg://lux:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/lux_delivery
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY (>= 32 chars)}
  BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
  CORS_ORIGINS: https://${DOMAIN:?defina DOMAIN}
  TRUSTED_PROXIES: 172.16.0.0/12
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  MEDIA_ROOT: /app/media

services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=250

  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    environment: *prod-env

  seed:
    profiles: ["demo"]   # nao roda em producao (use --profile demo se quiser dados de exemplo)
    environment: *prod-env

  api:
    ports: !reset []
    environment: *prod-env
    restart: always

  worker:
    environment: *prod-env
    restart: always

  web:
    ports: !reset []
    restart: always

  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/single-node/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:17-alpine
    restart: always
    environment:
      PGHOST: db
      PGUSER: lux
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: lux_delivery
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      # Not just "db healthy": otherwise the first dump runs before the schema exists (empty backup).
      migrate:
        condition: service_completed_successfully

volumes:
  caddy_data:
  caddy_config:
  backups:
